<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6f5fb">
<title>AI 활용 등급 진단</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%235b3fd1'/%3E%3Ctext x='32' y='43' font-size='28' font-family='sans-serif' font-weight='800' fill='white' text-anchor='middle'%3EAI%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#f6f5fb; --card:#fff; --ink:#17142b; --ink2:#55516e; --muted:#8c88a6; --line:#e7e4f2;
  --accent:#5b3fd1; --accent-soft:#efebff; --ok:#16a34a;
  --r:18px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;background:var(--bg);color:var(--ink);word-break:keep-all;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
.wrap{max-width:480px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:max(16px,env(safe-area-inset-top)) 16px max(20px,env(safe-area-inset-bottom))}
.screen{display:none;flex:1;flex-direction:column}
.screen.on{display:flex;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* intro */
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:13px;color:var(--ink2);margin-top:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--accent);color:#fff;font-style:normal;font-size:10px;font-weight:800;display:grid;place-items:center}
.hero{margin:40px 0 28px}
.hero .kicker{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:5px 10px;border-radius:99px}
.hero h1{font-size:34px;line-height:1.2;font-weight:800;letter-spacing:-.02em;margin:14px 0 10px}
.hero p{font-size:15px;line-height:1.6;color:var(--ink2)}
.ladder{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:6px 0 28px}
.ladder div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center}
.ladder b{display:block;font-size:11px;color:var(--muted);font-weight:700}
.ladder span{display:block;font-size:13px;font-weight:700;margin-top:2px}
.ladder .dot{display:block;width:8px;height:8px;border-radius:50%;margin:0 auto 6px}
.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.field label small{font-weight:500;color:var(--muted)}
.input{width:100%;height:52px;border-radius:14px;border:1.5px solid var(--line);background:var(--card);padding:0 16px;font-size:16px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.groups button{height:46px;border-radius:12px;background:var(--card);border:1.5px solid var(--line);font-weight:700;font-size:15px;transition:all .15s}
.groups button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1;min-height:20px}
.cta{width:100%;height:56px;border-radius:16px;background:var(--accent);color:#fff;font-size:17px;font-weight:700;box-shadow:0 8px 20px -8px rgba(91,63,209,.6);transition:transform .1s,opacity .15s}
.cta:active{transform:scale(.98)}
.cta:disabled{opacity:.35;box-shadow:none}
.ghost{width:100%;height:48px;margin-top:8px;font-size:15px;font-weight:600;color:var(--ink2)}

/* question */
.top{display:flex;align-items:center;gap:12px;height:44px}
.back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;color:var(--ink2)}
.back:disabled{visibility:hidden}
.bar{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .3s ease}
.count{font-size:13px;font-weight:700;color:var(--muted);min-width:34px;text-align:right}
.q{margin:28px 0 20px}
.q .n{font-size:13px;font-weight:800;color:var(--accent)}
.q h2{font-size:23px;line-height:1.38;font-weight:800;letter-spacing:-.01em;margin-top:8px;word-break:keep-all}
.q p{font-size:13px;color:var(--muted);margin-top:8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:58px;padding:14px 16px;border-radius:16px;background:var(--card);border:1.5px solid var(--line);text-align:left;font-size:16px;font-weight:600;line-height:1.35;word-break:keep-all;transition:border-color .15s,background .15s,transform .1s}
.opt:active{transform:scale(.99)}
.opt .mk{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #cfcae3;display:grid;place-items:center;transition:all .15s}
.opt.multi .mk{border-radius:7px}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.opt.on .mk{background:var(--accent);border-color:var(--accent)}
.opt .mk svg{opacity:0}
.opt.on .mk svg{opacity:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .opt{min-height:64px;font-size:15px}
.textq textarea{width:100%;min-height:110px;border-radius:16px;border:1.5px solid var(--line);background:var(--card);padding:16px;font:inherit;font-size:17px;line-height:1.5;resize:none;outline:none}
.textq textarea:focus{border-color:var(--accent)}
.textq .len{text-align:right;font-size:12px;color:var(--muted);margin-top:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chips button{font-size:13px;padding:7px 11px;border-radius:99px;background:var(--card);border:1px solid var(--line);color:var(--ink2)}

/* loading */
.loading{align-items:center;justify-content:center;text-align:center;gap:18px}
.scan{width:96px;height:96px;border-radius:28px;background:var(--accent);display:grid;place-items:center;color:#fff;font-weight:800;font-size:28px;position:relative;overflow:hidden;box-shadow:0 20px 40px -16px rgba(91,63,209,.7)}
.scan:after{content:"";position:absolute;left:0;right:0;height:30%;background:linear-gradient(transparent,rgba(255,255,255,.45),transparent);animation:sweep 1.1s ease-in-out infinite}
@keyframes sweep{from{top:-30%}to{top:100%}}
.loading p{font-size:16px;font-weight:700}
.loading small{font-size:13px;color:var(--muted)}

/* result */
.result-card{background:var(--card);border-radius:24px;border:1px solid var(--line);overflow:hidden;margin-top:12px;box-shadow:0 20px 40px -28px rgba(30,20,80,.35)}
.rc-head{padding:26px 22px 22px;color:#fff;position:relative;overflow:hidden}
.rc-head:before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.12)}
.rc-head:after{content:"";position:absolute;right:30px;bottom:-60px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08)}
.rc-head .who{font-size:13px;font-weight:600;opacity:.85}
.rc-head .lv{font-size:64px;font-weight:900;line-height:1;margin-top:14px;letter-spacing:-.03em}
.rc-head .lv small{font-size:22px;font-weight:800;margin-left:8px;letter-spacing:0}
.rc-head .tt{font-size:19px;font-weight:700;margin-top:8px}
.goal{position:absolute;right:18px;top:18px;z-index:1;font-size:12px;font-weight:800;background:#fff;color:var(--accent);padding:6px 10px;border-radius:99px}
.rc-body{padding:20px 22px 22px}
.rc-body .desc{font-size:15px;line-height:1.65;color:var(--ink2)}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:20px 0 8px}
.steps div{height:8px;border-radius:99px;background:var(--line)}
.steps-lab{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;font-size:11px;font-weight:700;color:var(--muted)}
.steps-lab span{text-align:center}
.steps-lab span.me{color:var(--ink)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--bg);border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:800}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.next{display:flex;gap:10px;margin-top:16px;padding:14px;border-radius:14px;background:var(--accent-soft);font-size:14px;line-height:1.55;color:var(--ink)}
.next b{flex:none;font-size:12px;font-weight:800;color:var(--accent);padding-top:2px}
.err{margin-top:12px;padding:12px 14px;border-radius:12px;background:#fff1f2;color:#be123c;font-size:13px;line-height:1.5;display:none}
.err.on{display:block}
.foot{text-align:center;font-size:12px;color:var(--muted);margin-top:16px}
</style>
</head>
<body>
<div class="wrap">

  <!-- 시작 -->
  <section class="screen on" id="intro">
    <div class="brand"><i>AI</i>생성형 AI 활용 업무 보조 바이브코딩</div>
    <div class="hero">
      <span class="kicker">8문항 · 1분</span>
      <h1>나의 AI 활용<br>등급은?</h1>
      <p>지금 AI를 어디까지 쓰고 있는지 확인해 봐요.<br>결과는 강사 화면에 실시간으로 모여요.</p>
    </div>
    <div class="ladder" id="ladder"></div>
    <div class="field">
      <label for="name">닉네임 <small>(선택 · 화면에 뜰 수 있어요)</small></label>
      <input class="input" id="name" maxlength="12" placeholder="예: 대물왕" autocomplete="off">
    </div>
    <div class="field">
      <label>우리 조</label>
      <div class="groups" id="groups"></div>
    </div>
    <div class="spacer"></div>
    <button class="cta" id="start">진단 시작</button>
  </section>

  <!-- 문항 -->
  <section class="screen" id="quiz">
    <div class="top">
      <button class="back" id="prev" aria-label="이전 문항"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="bar"><i id="barFill"></i></div>
      <div class="count" id="count"></div>
    </div>
    <div class="q"><div class="n" id="qn"></div><h2 id="qt"></h2><p id="qh"></p></div>
    <div id="qbody"></div>
    <div class="spacer"></div>
    <button class="cta" id="next" style="display:none">다음</button>
  </section>

  <!-- 분석 중 -->
  <section class="screen loading" id="loading">
    <div class="scan">AI</div>
    <p id="loadMsg">답변을 분석하고 있어요</p>
    <small>잠깐이면 돼요</small>
    <div class="err" id="err"></div>
    <button class="ghost" id="retrySend" style="display:none">다시 보내기</button>
  </section>

  <!-- 결과 -->
  <section class="screen" id="result">
    <div class="brand"><i>AI</i>AI 활용 등급 진단 결과</div>
    <div class="result-card">
      <div class="rc-head" id="rcHead">
        <span class="goal" id="goal" style="display:none">오늘의 목표 달성!</span>
        <div class="who" id="who"></div>
        <div class="lv" id="lv"></div>
        <div class="tt" id="tt"></div>
      </div>
      <div class="rc-body">
        <p class="desc" id="desc"></p>
        <div class="steps" id="steps"></div>
        <div class="steps-lab" id="stepsLab"></div>
        <div class="stats">
          <div class="stat"><b id="sScore"></b><span>활용 점수</span></div>
          <div class="stat"><b id="sRank"></b><span id="sRankLab">참가자 중</span></div>
        </div>
        <div class="next"><b>NEXT</b><span id="nextTip"></span></div>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="ghost" id="again">다시 진단하기</button>
    <div class="foot">강사 화면을 봐 주세요 👀</div>
  </section>
</div>

<script type="module">
import { QUESTIONS, LEVELS, GROUPS, MAX_SCORE, grade, defaultRoom } from './survey.js';

const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const room = (params.get('room') || defaultRoom()).replace(/[^0-9A-Za-z가-힣_-]/g, '').slice(0, 32) || 'main';
const KEY = `ai-level:${room}`;
const CHECK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function load() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch { return {}; } }
function save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch {} }

const state = Object.assign({ cid: null, name: '', group: null, answers: {}, result: null }, load());
if (!state.cid) state.cid = (crypto.randomUUID?.() || `${Date.now()}-${Math.random()}`).replace(/[^0-9a-z-]/gi, '');
save(state);
let idx = 0;

function show(id) {
  document.querySelectorAll('.screen').forEach((s) => s.classList.toggle('on', s.id === id));
  window.scrollTo(0, 0);
}

// ---------- 시작 화면
$('ladder').innerHTML = LEVELS.map((l) => `<div><i class="dot" style="background:${l.light}"></i><b>Lv.${l.lv}</b><span>${l.name}</span></div>`).join('');
$('groups').innerHTML = Array.from({ length: GROUPS }, (_, i) => `<button data-g="${i + 1}">${i + 1}조</button>`).join('');
$('name').value = state.name || '';
function paintGroups() {
  document.querySelectorAll('#groups button').forEach((b) => b.classList.toggle('on', Number(b.dataset.g) === state.group));
  $('start').disabled = !state.group;
  $('start').textContent = state.group ? '진단 시작' : '조를 골라 주세요';
}
$('groups').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  state.group = Number(b.dataset.g); save(state); paintGroups();
});
$('name').addEventListener('input', () => { state.name = $('name').value.trim(); save(state); });
$('start').addEventListener('click', () => { idx = 0; renderQ(); show('quiz'); });
paintGroups();

// ---------- 문항
const WISH_EXAMPLES = ['보고서 쓰기', '서류 정리', '전화 응대 기록', '견적 검토', '엑셀 취합', '메일 답장'];

function renderQ() {
  const q = QUESTIONS[idx];
  const a = state.answers;
  $('barFill').style.width = `${(idx / QUESTIONS.length) * 100}%`;
  $('count').textContent = `${idx + 1}/${QUESTIONS.length}`;
  $('prev').disabled = false;
  $('qn').textContent = `Q${idx + 1}`;
  $('qt').textContent = q.title;
  $('qh').textContent = q.hint || '';
  const next = $('next');

  if (q.text) {
    const v = a[q.id] || '';
    $('qbody').innerHTML = `<div class="textq"><textarea id="ta" maxlength="${q.max}" placeholder="예: 매일 쓰는 통화 기록 정리">${esc(v)}</textarea>
      <div class="len"><span id="len">${v.length}</span>/${q.max}</div>
      <div class="chips">${WISH_EXAMPLES.map((w) => `<button data-w="${esc(w)}">${esc(w)}</button>`).join('')}</div></div>`;
    const ta = $('ta');
    const sync = () => { a[q.id] = ta.value; $('len').textContent = ta.value.length; save(state); next.textContent = ta.value.trim() ? '결과 보기' : '건너뛰고 결과 보기'; };
    ta.addEventListener('input', sync);
    $('qbody').querySelector('.chips').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      ta.value = b.dataset.w; sync();
    });
    sync();
    next.style.display = '';
    next.disabled = false;
    return;
  }

  const picked = q.multi ? (a[q.id] || []) : a[q.id];
  const on = (o, i) => (q.multi ? picked.includes(o.key) : picked === i);
  $('qbody').innerHTML = `<div class="${q.multi ? 'grid2' : 'opts'}">${q.options.map((o, i) =>
    `<button class="opt${q.multi ? ' multi' : ''}${on(o, i) ? ' on' : ''}" data-i="${i}"><span class="mk">${CHECK}</span><span>${esc(o.label)}</span></button>`).join('')}</div>`;

  if (q.multi) {
    next.style.display = '';
    next.textContent = '다음';
    next.disabled = !picked.length;
  } else {
    next.style.display = 'none';
  }
}

$('qbody').addEventListener('click', (e) => {
  const b = e.target.closest('.opt'); if (!b) return;
  const q = QUESTIONS[idx];
  const o = q.options[Number(b.dataset.i)];
  if (q.multi) {
    let cur = state.answers[q.id] || [];
    if (cur.includes(o.key)) cur = cur.filter((k) => k !== o.key);
    else cur = o.exclusive ? [o.key] : [...cur.filter((k) => !q.options.find((x) => x.key === k)?.exclusive), o.key];
    state.answers[q.id] = cur;
    save(state);
    renderQ();
  } else {
    state.answers[q.id] = Number(b.dataset.i);
    save(state);
    renderQ();
    setTimeout(advance, 220);
  }
});
$('next').addEventListener('click', advance);
$('prev').addEventListener('click', () => {
  if (idx === 0) { show('intro'); return; }
  idx--; renderQ();
});

function advance() {
  if (idx < QUESTIONS.length - 1) { idx++; renderQ(); window.scrollTo(0, 0); return; }
  $('barFill').style.width = '100%';
  submit();
}

// ---------- 제출
async function submit() {
  show('loading');
  $('err').classList.remove('on');
  $('retrySend').style.display = 'none';
  const msgs = ['답변을 분석하고 있어요', '다른 참가자와 비교하는 중', '등급을 매기고 있어요'];
  let m = 0;
  $('loadMsg').textContent = msgs[0];
  const t = setInterval(() => { m = (m + 1) % msgs.length; $('loadMsg').textContent = msgs[m]; }, 700);
  const wait = new Promise((r) => setTimeout(r, 1600));
  try {
    const res = await fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ room, cid: state.cid, name: state.name, group: state.group, answers: state.answers }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || '서버 오류');
    await wait;
    state.result = data;
    save(state);
    renderResult();
    show('result');
  } catch (e) {
    $('err').textContent = `전송하지 못했어요. 와이파이·데이터를 확인하고 다시 눌러 주세요. (${e.message})`;
    $('err').classList.add('on');
    $('retrySend').style.display = '';
  } finally {
    clearInterval(t);
  }
}
$('retrySend').addEventListener('click', submit);

// ---------- 결과
function renderResult() {
  const r = state.result;
  const { score, level } = r.level != null ? r : grade(state.answers);
  const L = LEVELS[level];
  $('rcHead').style.background = `linear-gradient(135deg, ${L.light}, ${LEVELS[Math.min(3, level + 1)].light} 140%)`;
  if (level === 0) $('rcHead').style.background = `linear-gradient(135deg, #8a7fd8, #6f62c8)`;
  $('who').textContent = `${state.group ? `${state.group}조 ` : ''}${state.name || '익명'}님의 등급`;
  $('lv').innerHTML = `Lv.${level}<small>${L.name}</small>`;
  $('tt').textContent = L.title;
  $('goal').style.display = level >= 2 ? '' : 'none';
  $('desc').textContent = L.desc;
  $('steps').innerHTML = LEVELS.map((x) => `<div style="${x.lv <= level ? `background:${x.light}` : ''}"></div>`).join('');
  $('stepsLab').innerHTML = LEVELS.map((x) => `<span class="${x.lv === level ? 'me' : ''}">${x.name}${x.lv === 2 ? ' 🎯' : ''}</span>`).join('');
  $('sScore').textContent = `${score} / ${MAX_SCORE}`;
  if (r.count > 1) {
    const pct = Math.max(1, Math.round(((r.count - r.below) / r.count) * 100));
    $('sRank').textContent = `상위 ${pct}%`;
    $('sRankLab').innerHTML = `지금까지 ${r.count}명 중<br>같은 등급 ${r.same}명`;
  } else {
    $('sRank').textContent = '1등 참가';
    $('sRankLab').textContent = '가장 먼저 참여했어요';
  }
  $('nextTip').textContent = L.next;
}
$('again').addEventListener('click', () => {
  state.result = null; save(state);
  idx = 0; renderQ(); show('quiz');
});

if (state.result) { renderResult(); show('result'); }
</script>
</body>
</html>
