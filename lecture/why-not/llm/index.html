<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>LLM은 어떻게 말하나</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
@font-face{font-family:"PretendardLocal";src:url(../fonts/pretendard_regular.otf) format("opentype");font-weight:400 500}
@font-face{font-family:"PretendardLocal";src:url(../fonts/pretendard_semibold.otf) format("opentype");font-weight:600}
@font-face{font-family:"PretendardLocal";src:url(../fonts/pretendard_bold.otf) format("opentype");font-weight:700}
/* 16:9 무대(1920×1080)를 화면에 맞춰 축소. 흰 종이 + 잉크 라인 + 보라 강조 1색, 그림자·엠보싱 없이 움직임으로만 깊이를 냄 */
:root{
  --paper:#F4F5F8; --card:#FFFFFF; --ink:#16181F; --mute:#7C8293; --line:#D7DAE3;
  --soft:#ECEEF3; --accent:#5B3FF0; --accent-soft:#E9E4FF; --ok:#14966A; --bad:#E0402F;
  --sans:"IBM Plex Sans KR","PretendardLocal","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"Consolas",monospace;
  --ease:cubic-bezier(.22,1,.36,1); --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
html,body{height:100%}
body{background:#E6E8EE;color:var(--ink);font-family:var(--sans);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0;box-sizing:border-box}
#wrap{position:fixed;inset:0;padding:16px max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px))}
#stage{position:absolute;left:50%;top:50%;width:1920px;height:1080px;background:var(--paper);transform-origin:center;
  overflow:hidden;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none}
#stage:focus-visible{outline:4px solid var(--accent)}

/* 상단 바 */
#hud{position:absolute;left:72px;right:72px;top:48px;display:flex;align-items:center;gap:20px;z-index:20;pointer-events:none}
#act{font:600 24px var(--sans);letter-spacing:.02em;padding:8px 18px;border:2.5px solid var(--ink);border-radius:999px}
#ttl{font:600 26px var(--sans);color:var(--mute)}
#num{margin-left:auto;font:600 24px var(--mono);color:var(--mute);font-variant-numeric:tabular-nums}
#prog{position:absolute;left:72px;right:72px;bottom:28px;display:flex;gap:6px;z-index:20}
#prog i{flex:1;height:6px;border-radius:3px;background:var(--line);transition:background .4s}
#prog i.past{background:var(--ink)} #prog i.now{background:var(--accent)}
#hint{position:absolute;right:72px;bottom:48px;font:500 18px var(--sans);color:var(--mute);z-index:20;transition:opacity .6s}
/* 자막 */
#cap{position:absolute;left:0;right:0;bottom:84px;text-align:center;z-index:20;font:700 50px/1.32 var(--sans);letter-spacing:-.01em;
  transition:opacity .18s, transform .3s var(--ease);text-wrap:balance;padding:0 160px}
#cap.swap{opacity:0;transform:translateY(10px)}
#cap em{font-style:normal;color:var(--accent)}

/* 씬 공통 */
.scene{position:absolute;inset:0}
.scene.enter{animation:sIn .55s var(--ease) both}
.scene.leave{animation:sOut .4s ease both;pointer-events:none}
@keyframes sIn{from{opacity:0;transform:translateX(40px)}}
@keyframes sOut{to{opacity:0;transform:translateX(-40px)}}
.instant,.instant *{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}
.A{position:absolute}
[data-in]{opacity:0;translate:0 28px;transition:opacity .6s var(--ease) var(--d,0s),translate .8s var(--ease) var(--d,0s)}
[data-in].on{opacity:1;translate:0 0}
.off{opacity:0!important;translate:0 -20px!important}
[data-out]{transition:opacity .5s ease,translate .6s var(--ease)}

.h-big{font:700 64px/1.2 var(--sans);letter-spacing:-.02em}
.label{font:600 26px var(--sans);color:var(--mute)}
.tag{display:inline-block;font:600 24px var(--sans);padding:8px 18px;border-radius:999px;background:var(--ink);color:var(--paper)}
.tag.acc{background:var(--accent)} .tag.bad{background:var(--bad)} .tag.ok{background:var(--ok)}
.tag.line{background:transparent;color:var(--ink);border:2.5px solid var(--ink)}

/* 채팅창 */
.win{position:absolute;background:var(--card);border:3px solid var(--ink);border-radius:22px;overflow:hidden;
  transition:left .8s var(--ease),top .8s var(--ease),opacity .6s,transform .8s var(--ease)}
.tb{height:54px;border-bottom:3px solid var(--ink);display:flex;align-items:center;gap:10px;padding:0 22px}
.tb i{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--ink)}
.tb span{margin-left:10px;font:600 22px var(--sans);color:var(--mute)}
.wb{padding:26px 28px;display:flex;flex-direction:column;gap:16px}
.msg{font:500 30px/1.45 var(--sans);padding:14px 22px;border-radius:20px;max-width:88%;white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--ink);color:#fff;border-bottom-right-radius:6px}
.msg.ai{align-self:flex-start;background:var(--soft);border-bottom-left-radius:6px}
.cur{display:inline-block;width:3px;height:1.05em;background:var(--accent);vertical-align:-5px;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.bar{height:16px;border-radius:8px;background:var(--soft)}

/* 엔진 */
.engine{position:absolute;background:var(--ink);color:#fff;border-radius:30px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  transition:transform .9s var(--ease),opacity .7s,box-shadow .3s}
.engine b{font:700 76px var(--sans);letter-spacing:.06em}
.engine small{font:500 24px var(--sans);color:#A9AEC0}
.engine.top{justify-content:flex-start;padding-top:34px;box-sizing:border-box}
.engine.pulse{animation:pulse .7s var(--ease)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(91,63,240,.55);transform:scale(1)}40%{transform:scale(1.05)}100%{box-shadow:0 0 0 46px rgba(91,63,240,0);transform:scale(1)}}

/* 토큰 칩 */
.chip{display:inline-flex;align-items:center;height:88px;padding:0 26px;border:3px solid var(--ink);border-radius:16px;background:var(--card);
  font:600 46px var(--sans);white-space:pre;flex:none;transition:background .4s,color .4s,border-color .4s,transform .5s var(--spring),opacity .5s,filter .5s}
.chip.acc{background:var(--accent);border-color:var(--accent);color:#fff}
.chip.pop{animation:chipIn .75s var(--spring) both}
@keyframes chipIn{from{opacity:0;transform:translateX(260px) translateY(-40px) scale(.4)}}

/* 카드 뒤집기 */
.flip{perspective:1600px}
.flip .in{position:relative;width:100%;height:100%;transition:transform .9s var(--ease);transform-style:preserve-3d}
.flip.fl .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:3px solid var(--ink);border-radius:28px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:40px;box-sizing:border-box}
.flip .f{background:var(--card)}
.flip .b{background:var(--ink);color:#fff;transform:rotateY(180deg)}
.flip .f span{font:700 200px var(--sans);color:var(--line)}
.flip .b em{font:600 40px var(--mono);color:#B6A8FF;font-style:normal}
.flip .b p{font:700 46px/1.35 var(--sans);margin:22px 0 0;text-wrap:balance}

/* 막대 확률 */
.rows{display:flex;flex-direction:column;gap:22px}
.row{display:grid;grid-template-columns:330px 940px 160px;align-items:center;gap:26px;transition:opacity .5s}
.row .nm{text-align:right;font:600 40px var(--sans)}
.row .tr{height:52px;border-radius:12px;background:var(--soft);overflow:hidden}
.row .fi{height:100%;width:0;background:var(--ink);border-radius:12px;transition:width 1.1s var(--ease) var(--d,0s)}
.row .pc{font:600 38px var(--mono);font-variant-numeric:tabular-nums;opacity:0;transition:opacity .5s var(--d,0s)}
.showbars .row .fi{width:var(--w)} .showbars .row .pc{opacity:1}
.row.dim{opacity:.28} .row.hl .fi{background:var(--accent)} .row.hl .nm,.row.hl .pc{color:var(--accent)}

/* S01 */
.s01 .ghost{opacity:0;transform:scale(.85) rotate(var(--r));}
.s01.k1 .ghost{opacity:1;transform:scale(1) rotate(var(--r))}
.s01 .ghost .wb{gap:14px}
.s01 .ghost .msg{font-size:22px;padding:10px 16px}
.s01.k2 .ghost{opacity:0;transform:scale(.9) rotate(var(--r))}
.s01.k2 .main{left:110px!important;top:200px!important}
.s01.k3 .main{opacity:0}
.s01 .vs{position:absolute;left:1000px;width:810px;border:3px solid var(--ink);border-radius:26px;background:var(--card);padding:28px 32px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.s01 .vs .q{font:600 30px/1.4 var(--sans)}
.s01 .vs .q b{font-weight:700}
.s01 .vs .r{font:600 28px var(--sans);color:var(--mute)}
.s01 .vs .r em{font-style:normal;color:var(--ink);font-weight:700}
.s01 .why{position:absolute;left:1000px;top:690px;width:810px;text-align:center;font:700 58px var(--sans);color:var(--accent)}
.s01 .gate{position:absolute;left:0;right:0;top:330px;text-align:center}
.s01 .gate .h-big{font-size:70px;line-height:1.3}
.s01 .gate .h-big em{font-style:normal;color:var(--accent)}
/* S03 */
.s03.k1 .win{left:180px!important;opacity:.38}
.s03 .wire{height:0;border-top:4px dashed var(--accent);width:0;transition:width .8s var(--ease) .4s}
.s03.k1 .wire{width:300px}
/* S04 */
.s04 .llm{display:flex;gap:110px;justify-content:center;transition:transform .9s var(--ease)}
.s04.k1 .llm{transform:translateY(-110px) scale(.5)}
.s04 .lt{text-align:center}
.s04 .lt b{display:block;font:700 260px/1 var(--sans);animation:drop .9s var(--spring) both;animation-delay:var(--d)}
.s04 .lt span{display:block;font:600 40px var(--sans);color:var(--mute);margin-top:18px;animation:fade .6s both;animation-delay:calc(var(--d) + .5s)}
.s04 .lt span i{font-style:normal;color:var(--accent)}
@keyframes drop{from{opacity:0;transform:translateY(-200px)}}
@keyframes fade{from{opacity:0}}
.term{position:absolute;background:#101217;border-radius:22px;color:#D7DAE3;font:500 30px/1.6 var(--mono);padding:34px 38px;box-sizing:border-box}
.term .er{color:#FF7A6B;font-family:var(--sans);font-size:28px}
/* S05 */
.phone{position:absolute;border:4px solid var(--ink);border-radius:56px;background:var(--card);overflow:hidden}
.phone .scr{position:absolute;left:28px;right:28px;top:60px;height:250px;border:3px solid var(--line);border-radius:22px;padding:24px;font:600 40px var(--sans)}
.sugg{position:absolute;left:24px;right:24px;top:338px;display:flex;gap:10px}
.sugg span{flex:1;text-align:center;font:600 30px var(--sans);padding:16px 0;border-radius:14px;background:var(--soft);opacity:0;transform:translateY(14px);transition:all .5s var(--spring)}
.sugg.on span{opacity:1;transform:none}
.sugg span:nth-child(2){transition-delay:.08s}.sugg span:nth-child(3){transition-delay:.16s}
.sugg span.press{background:var(--accent);color:#fff;transform:scale(1.08)}
.keys{position:absolute;left:24px;right:24px;top:430px;display:grid;grid-template-columns:repeat(10,1fr);gap:8px}
.keys i{height:52px;border:2.5px solid var(--line);border-radius:10px}
/* S06 */
.blank{display:inline-block;width:240px;height:84px;border:4px dashed var(--accent);border-radius:16px;vertical-align:middle;margin-left:18px;animation:breathe 1.6s ease-in-out infinite}
@keyframes breathe{50%{background:var(--accent-soft)}}
/* S07 */
.s07 .sent{display:flex;justify-content:center;gap:0;transition:gap .8s var(--ease)}
.s07 .sent .chip{border-color:transparent;background:transparent;padding:0 4px;font-size:96px;height:150px;transition:all .8s var(--ease)}
.s07.k1 .sent{gap:30px}
.s07.k1 .sent .chip{border-color:var(--ink);background:var(--card);padding:0 34px}
.s07.k2 .sent .chip.nn{background:var(--accent);border-color:var(--accent);color:#fff;transform:translateY(-24px)}
/* S08 */
.loopset{display:flex;gap:18px;justify-content:center}
.loopset span{font:600 32px var(--sans);padding:14px 28px;border-radius:999px;border:3px solid var(--line);color:var(--mute);transition:all .3s}
.loopset span.act{border-color:var(--accent);background:var(--accent);color:#fff}
.tape{position:absolute;display:flex;gap:14px;justify-content:flex-end;align-items:center;overflow:hidden;padding:12px 0}
.tape.read .chip{animation:readSweep .6s ease both}
.tape.read .chip:nth-last-child(1){animation-delay:.25s}.tape.read .chip:nth-last-child(2){animation-delay:.2s}.tape.read .chip:nth-last-child(3){animation-delay:.15s}.tape.read .chip:nth-last-child(4){animation-delay:.1s}
@keyframes readSweep{40%{background:var(--accent-soft);border-color:var(--accent)}}
.flow{position:absolute;height:6px;background:repeating-linear-gradient(90deg,var(--accent) 0 18px,transparent 18px 32px);background-size:32px 6px;opacity:.25}
.flow.run{opacity:1;animation:flow .4s linear infinite}
@keyframes flow{to{background-position:32px 0}}
/* S09 */
.wheel{position:absolute;border-radius:50%;border:4px solid var(--ink);transition:transform 2.6s cubic-bezier(.12,.75,.12,1)}
.wheel .wl{position:absolute;font:700 30px var(--sans);white-space:nowrap}
.pin{position:absolute;width:0;height:0;border-left:30px solid transparent;border-right:30px solid transparent;border-top:54px solid var(--accent)}
.res b{font:700 96px var(--sans);color:var(--accent);display:inline-block}
.res b.pop{animation:popIn .6s var(--spring)}
@keyframes popIn{from{transform:scale(.3);opacity:0}}
/* S10 */
.s10.k1 .engine{transform:scale(5);opacity:0}
canvas{display:block}
/* S11 */
.sentcard{position:absolute;border:3px solid var(--ink);border-radius:28px;background:var(--card);padding:44px;box-sizing:border-box;font:700 54px/1.5 var(--sans)}
.slot{display:inline-flex;align-items:center;justify-content:center;min-width:220px;height:90px;padding:0 24px;border-radius:16px;background:var(--ink);color:#fff;vertical-align:middle;transition:background .4s}
.slot.bad{background:var(--bad)} .slot.ok{background:var(--ok)}
.slot b{animation:popIn .5s var(--spring)}
.fly{position:absolute;left:0;top:0;width:520px;padding:22px 28px;border:3px solid var(--ink);border-radius:20px;background:var(--card);font:600 30px var(--sans);opacity:0}
.s11.k3 .fly{animation:flyBy 1.4s linear infinite;animation-delay:var(--d)}
@keyframes flyBy{0%{opacity:0;transform:translate(900px,var(--y))}15%{opacity:1}85%{opacity:1}100%{opacity:0;transform:translate(-520px,var(--y))}}
.s11.k3 .sentcard{opacity:.0;transition:opacity .4s}
/* S12 */
.bf{position:absolute;animation:bookFall .7s cubic-bezier(.5,0,.75,0) both;animation-delay:var(--fd)}
@keyframes bookFall{from{transform:translateY(-1000px)}to{transform:translateY(0)}}
.bk{width:150px;height:30px;border:2.5px solid var(--ink);border-radius:5px;box-sizing:border-box;transition:transform 1s var(--ease) var(--sd),opacity .6s var(--sd)}
.s12.k1 .bk{transform:translate(var(--tx),var(--ty)) scale(.1) rotate(200deg);opacity:0}
.bigno{font:700 170px/1 var(--sans);letter-spacing:-.03em}
.bigno small{font-size:70px}
/* S13 */
.panel{position:absolute;border:3px solid var(--ink);border-radius:30px;background:var(--card);box-sizing:border-box;padding:34px}
.stream{font:500 30px/1.6 var(--sans);color:var(--ink);height:250px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.stream div{animation:fade .4s both}
.pick{display:flex;align-items:center;gap:18px;border:3px solid var(--line);border-radius:18px;padding:16px 22px;font:500 28px var(--sans)}
.pick .mk{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font:700 28px var(--sans);color:#fff}
/* S14 */
.glass{position:absolute;border:4px solid var(--accent);border-radius:24px;background:rgba(91,63,240,.08);transform:translateY(-760px);transition:transform 1s var(--spring);display:flex;align-items:flex-start;justify-content:flex-end;padding:22px;box-sizing:border-box}
.s14.k1 .glass{transform:none}
.bub{position:absolute;right:-560px;font:600 32px var(--sans);padding:16px 28px;border-radius:24px;background:var(--ink);color:#fff;white-space:nowrap;opacity:0}
.s14.k2 .bub{animation:bubFly 3.2s linear infinite;animation-delay:var(--d)}
@keyframes bubFly{0%{opacity:0;transform:translateX(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(-2500px)}}
.qpop{position:absolute;border-radius:30px;background:var(--accent);color:#fff;display:flex;align-items:center;gap:30px;padding:40px 56px;font:700 58px var(--sans);transform:scale(.6);opacity:0;transition:all .7s var(--spring)}
.s14.k3 .qpop{transform:none;opacity:1}
.qpop b{font-size:120px;line-height:1}
/* S15/S16 테이프 */
.seg{flex:none;display:flex;align-items:center;gap:12px;height:84px;padding:0 24px;border:3px solid var(--ink);border-radius:16px;background:var(--card);font:600 30px var(--sans);white-space:nowrap;transition:all .6s var(--ease)}
.seg i{font-style:normal;font:600 20px var(--mono);padding:4px 10px;border-radius:8px;background:var(--soft);color:var(--mute)}
.seg.ai{background:var(--soft)} .seg.ai i{background:#fff}
.seg.acc{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg.gone{opacity:.18;filter:blur(3px)}
.seg.pop{animation:chipIn .7s var(--spring) both}
.ghosttape{position:absolute;display:flex;gap:10px;pointer-events:none}
.ghosttape.go{animation:suck 1s var(--ease) forwards}
@keyframes suck{0%{opacity:1}100%{opacity:0;transform:translate(var(--gx),var(--gy)) scale(.2)}}
.stamp{position:absolute;font:700 34px var(--sans);color:var(--accent);border:4px solid var(--accent);border-radius:14px;padding:10px 22px;transform:rotate(-6deg)}
.stamp.bad{color:var(--bad);border-color:var(--bad)}
.stamp[data-in].on{animation:stampIn .5s var(--spring) var(--d,0s) both}
@keyframes stampIn{from{transform:rotate(-6deg) scale(1.8);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.cw{position:absolute;border:4px dashed var(--accent);border-radius:24px}
.msg.hl{background:var(--accent);color:#fff}
/* S18 */
.tip{position:absolute;top:250px;width:520px;height:470px;border:3px solid var(--ink);border-radius:30px;background:var(--card);padding:40px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
.tip .ic{height:140px;border-radius:20px;background:var(--soft);display:flex;align-items:center;justify-content:center;gap:10px}
.tip h3{margin:0;font:700 44px/1.3 var(--sans);text-wrap:balance}
.tip p{margin:0;font:500 30px/1.45 var(--sans);color:var(--mute)}
.tip em{font:600 26px var(--mono);color:var(--accent);font-style:normal}
.mini{width:56px;height:44px;border:3px solid var(--ink);border-radius:9px;background:#fff}
/* S19 */
.node{position:absolute;top:330px;width:230px;height:170px;border:3px solid var(--line);border-radius:24px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;transition:all .35s var(--ease);color:var(--mute)}
.node b{font:700 34px var(--sans)} .node small{font:500 22px var(--sans)}
.node.on{border-color:var(--ink);color:var(--ink)}
.node.hot{border-color:var(--accent);background:var(--accent);color:#fff;transform:translateY(-12px)}
.dot{position:absolute;width:30px;height:30px;border-radius:50%;background:var(--accent);top:400px;transition:left .45s var(--ease),top .45s var(--ease);opacity:0}

@media (prefers-reduced-motion: reduce){
  *{animation-duration:.01s!important;transition-duration:.01s!important}
}
body.embed{background:transparent}
body.embed #wrap{padding:0}
body.embed #stage{border-radius:14px}
</style>

<div id="wrap">
  <div id="stage" tabindex="0" aria-label="LLM 원리 모션그래픽. 클릭하거나 오른쪽 화살표로 다음, 왼쪽 화살표로 이전">
    <div id="hud"><span id="act"></span><span id="ttl"></span><span id="num"></span></div>
    <div id="cap"></div>
    <div id="hint">클릭 · → 다음 &nbsp; ← 이전 &nbsp; F 전체화면</div>
    <div id="prog"></div>
  </div>
</div>

<script>
(()=>{
const stage=document.getElementById('stage');
const css=getComputedStyle(document.documentElement);
const C={ink:css.getPropertyValue('--ink').trim(),line:css.getPropertyValue('--line').trim(),accent:css.getPropertyValue('--accent').trim(),mute:css.getPropertyValue('--mute').trim()};

/* ---------- 다이얼 벽 (가중치) ---------- */
function Dials(cv,cols,rows){
  const g=cv.getContext('2d'),W=cv.width,H=cv.height,cw=W/cols,ch=H/rows,r=Math.min(cw,ch)*.36,n=cols*rows;
  const a=new Float32Array(n),t=new Float32Array(n),hi=new Float32Array(n);
  for(let i=0;i<n;i++){a[i]=t[i]=Math.random()*6.283}
  let mode='random',alive=true,f=0,raf;
  const ord=i=>{const x=i%cols,y=i/cols|0;return Math.sin(x*.38+y*.21)*1.2+Math.cos(y*.33-x*.05)*1.0+2.4};
  function draw(){
    g.clearRect(0,0,W,H);g.lineCap='round';
    for(let i=0;i<n;i++){
      const x=(i%cols+.5)*cw,y=((i/cols|0)+.5)*ch,h=hi[i]>.25;
      g.lineWidth=Math.max(2,r*.13);
      g.strokeStyle=h?C.accent:(mode==='locked'?'#9097A8':C.line);
      g.beginPath();g.arc(x,y,r,0,6.283);g.stroke();
      g.strokeStyle=h?C.accent:C.ink;g.lineWidth=Math.max(2.5,r*.17);
      g.beginPath();g.moveTo(x,y);g.lineTo(x+Math.cos(a[i])*r*.82,y+Math.sin(a[i])*r*.82);g.stroke();
    }
  }
  function loop(){
    if(!alive)return;f++;
    if(mode==='random'&&f%5===0){for(let j=0;j<n*.015;j++){const i=Math.random()*n|0;t[i]=Math.random()*6.283}}
    if(mode==='order'&&f%30===0){for(let j=0;j<n*.02;j++){const i=Math.random()*n|0;t[i]=ord(i)+(Math.random()-.5)*.15}}
    if(mode!=='locked')for(let i=0;i<n;i++)a[i]+=(t[i]-a[i])*.07;
    for(let i=0;i<n;i++)hi[i]*=.965;
    draw();raf=requestAnimationFrame(loop);
  }
  loop();
  return{
    set(m){mode=m;if(m==='order')for(let i=0;i<n;i++)t[i]=ord(i);},
    snap(){for(let i=0;i<n;i++)a[i]=t[i];draw()},
    twitch(c=.12,amp=1.4){for(let j=0;j<n*c;j++){const i=Math.random()*n|0;t[i]+=(Math.random()-.5)*amp;hi[i]=1}},
    stop(){alive=false;cancelAnimationFrame(raf)}
  };
}
function dialsIn(root,sel,cols,rows,ctx){const cv=root.querySelector(sel);const d=Dials(cv,cols,rows);ctx.clean.push(()=>d.stop());return d}

/* ---------- 공통 조각 ---------- */
const win=(x,y,w,h,title,body,extra='')=>`<div class="win ${extra}" style="left:${x}px;top:${y}px;width:${w}px;${h?`height:${h}px`:''}"><div class="tb"><i></i><i></i><i></i><span>${title}</span></div><div class="wb">${body}</div></div>`;
const engine=(x,y,w,h,sub='다음 토큰 뽑기',extra='')=>`<div class="engine ${extra}" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px"><b>LLM</b><small>${sub}</small></div>`;
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');

/* ---------- 씬 정의 ---------- */
const S=[];
const A0='0막 오프닝',A1='1막 LLM이란',A2='2막 답이 써지는 원리',A3='3막 어떻게 배웠나',A4='4막 대화가 이어지는 원리',A5='5막 그래서 이렇게 쓴다';

// S01 (앞 장 '실망한 답 · 만족한 답'에서 이어짐)
const Q01='주말에 와이프랑 1박 2일, 자차로 놀러 갈 만한 서울 근교 여행지 추천해 줘';
S.push({act:A0,title:'원하는 답이 안 나오는 이유',caps:['아까 그 질문','어느 AI에 물어도 *누구나 아는 답*','어떤 답은 실망, 어떤 답은 *만족*. 차이는?','답을 바꾸려면, 먼저 *AI를 이해*해야'],
 html:win(560,170,800,0,'AI 채팅',`<div class="msg me">${Q01}</div><div class="msg ai"><span class="st"></span><span class="cur"></span></div>`,'main')
 +[['챗GPT',90,150,-4],['클로드',1450,170,3],['제미나이',110,640,2],['코파일럿',1430,640,-3]].map(([t,x,y,r],i)=>
   `<div class="win ghost" style="left:${x}px;top:${y}px;width:380px;--r:${r}deg;transition-delay:${i*.09}s"><div class="tb"><i></i><i></i><i></i><span>${t}</span></div><div class="wb"><div class="bar" style="width:70%;margin-left:auto;background:var(--ink)"></div><div class="msg ai">${['가평 · 춘천 · 양평…','양평 · 가평 · 포천…','춘천 · 가평 · 남이섬…','가평 · 양평 · 원주…'][i]}</div></div></div>`).join('')
 +`<div class="vs" data-in="2" data-out="3" style="top:170px"><span class="tag bad" style="align-self:flex-start">실망</span><div class="q">여행지 추천 · 선물 추천 · 회식 장소</div><div class="r">→ <em>누구나 아는 답</em></div></div>`
 +`<div class="vs" data-in="2" data-out="3" style="top:420px;--d:.25s"><span class="tag ok" style="align-self:flex-start">만족</span><div class="q">법 조항 · 약 성분 · 엑셀 함수</div><div class="r">→ <em>딱 맞는 답</em></div></div>`
 +`<div class="why" data-in="2" data-out="3" style="--d:.6s">차이는?</div>`
 +`<div class="gate" data-in="3" style="--d:.2s"><div class="h-big">답을 바꾸려면, 먼저<br><em>AI가 답을 만드는 방식</em>을 알아야 합니다</div></div>`,
 on(r,k,anim,ctx){
   if(k!==0)return;
   const full='1. 원주 · 뮤지엄 산, 소금산\n2. 양평 · 두물머리\n3. 가평 · 남이섬, 쁘띠프랑스\n4. 포천 · 산정호수',el=r.querySelector('.st');
   if(!anim){el.textContent=full;return}
   let i=0;ctx.later(()=>ctx.every(()=>{i+=1;el.textContent=full.slice(0,i);return i<full.length},40),500);
 }});

// S02
const qcards=(ans)=>[0,1,2].map(i=>`<div class="A flip q${i}" style="left:${230+i*510}px;top:210px;width:440px;height:520px"><div class="in"><div class="f"><span>?</span></div><div class="b"><em>${['①','②','③'][i]}</em><p>${ans[i]}</p></div></div></div>`).join('');
S.push({act:A0,title:'오늘의 질문',caps:['① 답은 어떻게 써지나','② 어떻게 배웠나','③ 내 말을 기억하나'],
 html:qcards(['답은 어떻게<br>써지나','어떻게<br>배웠나','내 말을<br>기억하나']),
 on(r,k,anim,ctx){const c=r.querySelector('.q'+k);if(anim)ctx.later(()=>c.classList.add('fl'),k===0?350:0);else for(let i=0;i<=k;i++)r.querySelector('.q'+i).classList.add('fl')}});

// S03
S.push({act:A1,title:'제품과 엔진',caps:['채팅창 = 제품','그 뒤에 숨은 *엔진*','챗GPT·클로드 = 제품 / 그 안의 엔진 = *LLM*'],
 html:win(640,200,640,420,'AI 채팅',`<div class="msg me">이 메일 좀 다듬어 줘</div><div class="msg ai">네, 이렇게 바꿔 봤어요.</div><div class="bar" style="width:80%"></div><div class="bar" style="width:55%"></div>`)
 +`<div class="A wire" data-in="1" style="left:860px;top:410px"></div>`
 +`<div data-in="1" style="--d:.5s">${engine(1200,260,520,320,'말을 알아듣고 답을 만드는 곳')}</div>`
 +`<div class="A label" data-in="2" style="left:180px;top:650px;width:640px;text-align:center"><span class="tag line">제품 = 자동차 외관</span></div>`
 +`<div class="A label" data-in="2" style="left:1200px;top:620px;width:520px;text-align:center;--d:.15s"><span class="tag acc">LLM = 엔진</span></div>`});

// S04
S.push({act:A1,title:'Large Language Model',caps:['엄청난 양의 글로 배운 *말하는 엔진*','명령어 → *말로 부탁*'],
 html:`<div class="A llm" style="left:0;right:0;top:170px">${[['L','Large','큰'],['L','Language','언어'],['M','Model','모델']].map(([l,w,k],i)=>`<div class="lt" style="--d:${i*.18}s"><b>${l}</b><span>${w} · <i>${k}</i></span></div>`).join('')}</div>`
 +`<div class="A label" data-in="1" style="left:180px;top:330px">예전 · 명령어</div><div class="A label" data-in="1" style="left:1040px;top:330px;--d:.2s">지금 · 말로 부탁</div>`
 +`<div data-in="1"><div class="term" style="left:180px;top:380px;width:700px;height:380px">C:\\&gt; dri<br><span class="er">'dri'은(는) 내부 또는 외부 명령, 실행할 수 있는 프로그램, 또는 배치 파일이 아닙니다.</span><br>C:\\&gt; <span class="cur"></span></div></div>`
 +`<div data-in="1" style="--d:.25s">${win(1040,380,700,380,'AI 채팅',`<div class="msg me">엑셀 표 좀 정리해 줘</div><div class="msg ai">네, 부서별로 정리했어요.</div><div class="bar" style="width:85%"></div><div class="bar" style="width:62%"></div>`)}</div>`});

// S05
S.push({act:A2,title:'폰 자동완성',caps:['다음에 올 말은?','LLM의 본질 = *다음 단어 맞히기*'],
 html:`<div class="phone" style="left:300px;top:130px;width:520px;height:700px"><div class="scr"><span class="ty"></span><span class="cur"></span></div><div class="sugg"><span>만날까</span><span>집에서</span><span>몇 시에</span></div><div class="keys">${'<i></i>'.repeat(40)}</div></div>`
 +`<div class="A h-big" style="left:960px;top:300px">다음에 올 말은?</div>`
 +`<div class="A" data-in="1" style="left:960px;top:420px"><div class="label" style="margin-bottom:16px">이 기능을 어마어마하게 키운 것</div><span class="tag acc" style="font-size:44px;padding:18px 34px">= LLM</span></div>`,
 on(r,k,anim,ctx){
   const ty=r.querySelector('.ty'),sg=r.querySelector('.sugg'),p=sg.children[0];
   if(k===0){const t='내일 우리';if(!anim){ty.textContent=t;sg.classList.add('on');return}
     let i=0;ctx.later(()=>ctx.every(()=>{ty.textContent=t.slice(0,++i);if(i>=t.length){ctx.later(()=>sg.classList.add('on'),250);return false}return true},140),400)}
   if(k===1){ty.textContent='내일 우리';sg.classList.add('on');p.classList.add('press');const fin=()=>{ty.textContent='내일 우리 만날까';p.classList.remove('press')};anim?ctx.later(fin,450):fin()}
 }});

// S06 / S17 막대 공통
function barsHTML(list,max){return `<div class="A rows" style="left:120px;top:330px">${list.map(([n,v],i)=>`<div class="row" style="--w:${Math.max(.15,v/max*100)}%;--d:${i*.12}s"><div class="nm">${n}</div><div class="tr"><div class="fi"></div></div><div class="pc">${v<1?v:v+'%'}${v<1?'%':''}</div></div>`).join('')}</div>`}
S.push({act:A2,title:'오늘 점심 메뉴는',caps:['다음에 올 말은?','후보마다 *확률*을 매김','말이 안 되는 후보는 *거의 0*'],
 html:`<div class="A h-big" style="left:0;right:0;top:170px;text-align:center">오늘 점심 메뉴는<span class="blank"></span></div>`
 +barsHTML([['김치찌개',30],['짜장면',22],['돈가스',15],['제육볶음',11],['국밥',8],['자동차',.01]],30)
 +`<div class="A" data-in="2" style="left:1580px;top:778px"><span class="tag acc">거의 0</span></div>`,
 on(r,k){const R=r.querySelector('.rows');R.classList.toggle('showbars',k>=1);const rows=[...R.children];rows.forEach((e,i)=>{e.classList.toggle('dim',k>=2&&i<5);e.classList.toggle('hl',k>=2&&i===5)});
   r.querySelector('.rows').style.top=k>=1?'330px':'330px'}});

// S07
S.push({act:A2,title:'토큰',caps:['AI는 글을 어떻게 읽을까','글을 *조각*으로 자름','토큰 = AI가 읽고 쓰는 *글 조각*'],
 html:`<div class="A sent" style="left:0;right:0;top:280px">${['오늘',' 점심',' 메뉴','는'].map((t,i)=>`<span class="chip${i===3?' nn':''}">${t}</span>`).join('')}</div>`
 +`<div class="A" data-in="1" style="left:0;right:0;top:500px;text-align:center;--d:.5s"><span class="tag line" style="font-size:32px">토큰 4개</span></div>`
 +`<div class="A" data-in="2" style="left:0;right:0;top:600px;display:flex;justify-content:center;align-items:center;gap:20px;--d:.3s"><span class="label">단어보다 작은 조각도 토큰 ·</span><span class="chip" style="height:72px;font-size:36px">김치찌개</span><span class="label">→</span><span class="chip acc" style="height:72px;font-size:36px">김치</span><span class="chip acc" style="height:72px;font-size:36px">찌개</span></div>`});

// S08 핵심 루프
const BASE=['오늘',' 점심',' 메뉴','는'],STEP=[' 김치','찌개','예요'],FAST=['.',' 오늘','처럼',' 쌀쌀','한',' 날','엔',' 뜨끈','한',' 국물','이',' 최고','죠','.'];
S.push({act:A2,title:'하나 뽑고, 다시 보고',caps:['지금까지 쓴 글을 보고','토큰 하나 *뽑기*','붙이고 → *다시 보기*','또 뽑고 → 또 붙이기','그래서 답이 *한 글자씩* 흘러나옴'],
 html:`<div class="A loopset" style="left:0;right:0;top:160px"><span>① 지금까지 글 읽기</span><span>② 다음 토큰 하나 뽑기</span><span>③ 끝에 붙이기</span></div>`
 +`<div class="A tape" style="left:110px;top:360px;width:1080px;height:112px"></div>`
 +`<div class="A flow" style="left:1200px;top:413px;width:130px"></div>`
 +engine(1340,280,420,280)
 +`<div data-in="4">${win(360,560,1200,0,'AI 채팅',`<div class="msg me">오늘 점심 메뉴는?</div><div class="msg ai"><span class="st"></span><span class="cur"></span></div>`)}</div>`,
 init(r){r._tape=r.querySelector('.tape');r._n=0},
 on(r,k,anim,ctx){
   const tape=r._tape,eng=r.querySelector('.engine'),flow=r.querySelector('.flow'),L=[...r.querySelectorAll('.loopset span')],st=r.querySelector('.st');
   const add=(t,pop)=>{const c=document.createElement('span');c.className='chip'+(pop?' pop':'');c.textContent=t;tape.appendChild(c);return c};
   const act=i=>L.forEach((e,j)=>e.classList.toggle('act',j===i));
   if(!anim){tape.innerHTML='';BASE.forEach(t=>add(t));STEP.slice(0,Math.min(k,3)).forEach(t=>add(t));if(k>=4){FAST.forEach(t=>add(t));st.textContent=(STEP.join('')+FAST.join('')).trim()}else act(k===0?0:2);
     [...tape.children].forEach((c,i)=>c.classList.toggle('acc',i>=BASE.length&&i===tape.children.length-1&&k<4));return}
   if(k===0){BASE.forEach((t,i)=>ctx.later(()=>add(t,true),200+i*120));ctx.later(()=>act(0),800);return}
   const cycle=(tok,fast)=>{const s=fast?.32:1;
     act(0);tape.classList.remove('read');void tape.offsetWidth;tape.classList.add('read');flow.classList.add('run');
     ctx.later(()=>{act(1);eng.classList.remove('pulse');void eng.offsetWidth;eng.classList.add('pulse')},700*s);
     ctx.later(()=>{act(2);flow.classList.remove('run');[...tape.children].forEach(c=>c.classList.remove('acc'));const c=add(tok,true);if(!fast)c.classList.add('acc');if(fast)st.textContent+=tok;},1150*s)};
   if(k<=3){cycle(STEP[k-1]);return}
   st.textContent=STEP.join('').trim();[...tape.children].forEach(c=>c.classList.remove('acc'));
   FAST.forEach((t,i)=>ctx.later(()=>cycle(t,true),400+i*430));
   ctx.later(()=>act(-1),400+FAST.length*430+500);
 }});

// S09 돌림판
const SEG=[['김치찌개',30,'#5B3FF0','#fff'],['짜장면',22,'#16181F','#fff'],['돈가스',15,'#B9ADFF','#16181F'],['제육볶음',11,'#D7DAE3','#16181F'],['국밥',8,'#8A78F5','#fff'],['기타',14,'#ECEEF3','#7C8293']];
(function(){let acc=0;SEG.forEach(s=>{s.from=acc;acc+=s[1]/100*360;s.to=acc;s.mid=(s.from+s.to)/2})})();
S.push({act:A2,title:'같은 질문, 다른 답',caps:['확률 = 돌림판 칸 크기','1등이 잘 나오긴 함','그래도 *매번 1등은 아님*','같은 질문, *다른 답*'],
 html:`<div class="wheel" style="left:220px;top:200px;width:580px;height:580px;background:conic-gradient(${SEG.map(s=>`${s[2]} ${s.from}deg ${s.to}deg`).join(',')})">${SEG.map(s=>`<span class="wl" style="color:${s[3]};left:${290+Math.sin(s.mid*Math.PI/180)*190}px;top:${290-Math.cos(s.mid*Math.PI/180)*190}px;transform:translate(-50%,-50%) rotate(${s.mid}deg)">${s[0]}</span>`).join('')}</div>`
 +`<div class="pin" style="left:480px;top:168px"></div>`
 +`<div class="A res" style="left:960px;top:230px"><div class="label">이번에 뽑힌 토큰</div><b class="rv">?</b></div>`
 +`<div data-in="3">${win(960,470,420,0,'첫 번째 질문',`<div class="msg me">점심 뭐 먹지?</div><div class="msg ai">김치찌개 어때요?</div>`)}</div>`
 +`<div data-in="3" style="--d:.2s">${win(1420,470,420,0,'같은 질문 다시',`<div class="msg me">점심 뭐 먹지?</div><div class="msg ai">짜장면 어때요?</div>`)}</div>`,
 init(r){r._rot=0},
 on(r,k,anim,ctx){
   const w=r.querySelector('.wheel'),rv=r.querySelector('.rv');
   const spinTo=(idx,inst)=>{const c=SEG[idx].mid+(Math.random()-.5)*SEG[idx][1]*2.2;const base=r._rot;let delta=((-c-base)%360+360)%360;r._rot=inst?-c:base+360*5+delta;w.style.transform=`rotate(${r._rot}deg)`;
     const show=()=>{rv.textContent=SEG[idx][0];rv.classList.remove('pop');void rv.offsetWidth;rv.classList.add('pop')};inst?(rv.textContent=SEG[idx][0]):ctx.later(show,2500)};
   if(k===0){rv.textContent='?';return}
   if(k===1)spinTo(0,!anim);
   if(k>=2&&(anim?k===2:true))spinTo(1,!anim);
 }});

// S10 다이얼
S.push({act:A3,title:'다이얼 벽 = 가중치',caps:['엔진 안을 열어 보면','가중치 = *수십억~수천억 개의 다이얼*'],

const hud={act:document.getElementById('act'),ttl:document.getElementById('ttl'),num:document.getElementById('num'),cap:document.getElementById('cap'),prog:document.getElementById('prog'),hint:document.getElementById('hint')};
hud.prog.innerHTML=S.map(()=>'<i></i>').join('');
let si=0,k=0,cur=null,capTimer;
const capHTML=s=>esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>').replace(/ \/ /g,'<br>');

function makeCtx(){const c={timers:[],clean:[]};
  c.later=(fn,ms)=>{c.timers.push(setTimeout(fn,ms))};
  c.every=(fn,ms)=>{const id=setInterval(()=>{if(fn()===false)clearInterval(id)},ms);c.timers.push(id)};
  return c}
function kill(c){if(!c)return;c.timers.forEach(id=>{clearTimeout(id);clearInterval(id)});c.clean.forEach(f=>f())}

function setCap(text,anim){clearTimeout(capTimer);
  if(!anim){hud.cap.innerHTML=capHTML(text);hud.cap.classList.remove('swap');return}
  hud.cap.classList.add('swap');capTimer=setTimeout(()=>{hud.cap.innerHTML=capHTML(text);hud.cap.classList.remove('swap')},190)}

function apply(root,def,kk,anim,ctx){
  root.className=root.className.replace(/\bk\d+\b/g,'').trim();
  for(let j=0;j<=kk;j++)root.classList.add('k'+j);
  root.querySelectorAll('[data-in]').forEach(e=>e.classList.toggle('on',kk>=+e.dataset.in));
  root.querySelectorAll('[data-out]').forEach(e=>e.classList.toggle('off',kk>=+e.dataset.out));
  setCap(def.caps[Math.min(kk,def.caps.length-1)],anim);
  def.on&&def.on(root,kk,anim,ctx);
}

function build(i,kk,mode){ // mode: 'enter' | 'instant'
  const def=S[i];
  if(cur){const old=cur;kill(old.ctx);if(mode==='enter'){old.root.classList.add('leave');setTimeout(()=>old.root.remove(),420)}else old.root.remove()}
  const root=document.createElement('section');root.className='scene s'+String(i+1).padStart(2,'0');root.innerHTML=def.html;
  if(mode==='instant')root.classList.add('instant');else root.classList.add('enter');
  stage.insertBefore(root,hud.cap);
  const ctx=makeCtx();def.init&&def.init(root,ctx);
  cur={root,ctx,i};
  if(mode==='instant'){apply(root,def,kk,false,ctx);requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('instant')))}
  else{requestAnimationFrame(()=>apply(root,def,kk,true,ctx))}
  si=i;k=kk;hudUpdate();
}
function hudUpdate(){const d=S[si];hud.act.textContent=d.act;hud.ttl.textContent=d.title;hud.num.textContent=String(si+1).padStart(2,'0')+' / '+S.length;
  [...hud.prog.children].forEach((e,j)=>{e.className=j<si?'past':j===si?'now':''});
  try{history.replaceState(null,'','#s'+(si+1))}catch(e){}
  tell(Object.assign({state:1},edge()))}

const EMB=window.parent!==window;if(EMB)document.body.classList.add('embed');
function tell(m){if(EMB)try{parent.postMessage(Object.assign({llm:1},m),'*')}catch(e){}}
function edge(){return{atStart:si===0&&k===0,atEnd:si===S.length-1&&k===S[si].caps.length-1}}
function next(){hud.hint.style.opacity=0;const d=S[si];if(si===S.length-1&&k===d.caps.length-1){tell({edge:1});return}
  if(k<d.caps.length-1){k++;apply(cur.root,d,k,true,cur.ctx);tell(Object.assign({state:1},edge()));return}
  if(si<S.length-1)build(si+1,0,'enter')}
function prev(){const d=S[si];if(si===0&&k===0){tell({edge:-1});return}
  if(k>0){build(si,k-1,'instant');return}
  if(si>0){build(si-1,S[si-1].caps.length-1,'instant')}}

stage.addEventListener('click',next);
addEventListener('keydown',e=>{
  let key=e.key;
  if(!key||key==='Unidentified') key={34:'PageDown',33:'PageUp',39:'ArrowRight',37:'ArrowLeft',40:'ArrowDown',38:'ArrowUp',116:'F5',190:'.'}[e.keyCode]||key;
  if(['ArrowRight','PageDown','ArrowDown',' ','Enter'].includes(key)){e.preventDefault();next()}
  else if(['ArrowLeft','PageUp','ArrowUp','Backspace'].includes(key)){e.preventDefault();prev()}
  else if(EMB&&!e.metaKey&&!e.ctrlKey&&!e.altKey){if(key==='F5')e.preventDefault();tell({key:key,shift:e.shiftKey})}
  else if(e.key==='f'||e.key==='F'){const el=document.documentElement;(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen?.())?.catch?.(()=>{})}
  else if(e.key==='Home'){build(0,0,'enter')}
});
function fit(){const w=document.getElementById('wrap'),cs=getComputedStyle(w);
  const W=w.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight),H=w.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom);
  const s=Math.min(W/1920,H/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;
  const p=parseFloat(cs.paddingLeft),q=parseFloat(cs.paddingTop);stage.style.left=(p+W/2)+'px';stage.style.top=(q+H/2)+'px'}
addEventListener('resize',fit);fit();
addEventListener('message',e=>{const m=e.data;if(!m||m.llmCmd==null)return;
  if(m.llmCmd==='next')next();else if(m.llmCmd==='prev')prev();
  else if(m.llmCmd==='start')build(0,0,'enter');else if(m.llmCmd==='end')build(S.length-1,S[S.length-1].caps.length-1,'instant');});
const m=/^#s(\d+)$/.exec(location.hash);const start=m?Math.min(S.length,Math.max(1,+m[1]))-1:0;
build(start,0,'enter');if(!EMB)stage.focus({preventScroll:true});
window.__go=(i,kk)=>build(i,kk,'instant');
})();
