<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>경리 콕핏 · 사업비 관리</title>
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="app" class="app">
    <aside class="rail" aria-label="주 메뉴">
      <div class="rail__brand" title="경리 콕핏"><span class="brand-mark">₩</span></div>
      <nav class="rail__nav" id="nav"></nav>
      <div class="rail__foot">
        <button class="iconbtn" id="themeToggle" title="테마 전환" aria-label="테마 전환">◐</button>
      </div>
    </aside>

    <header class="topbar">
      <div class="topbar__left">
        <h1 class="topbar__title" id="viewTitle">대시보드</h1>
        <span class="topbar__sub" id="viewSub"></span>
      </div>
      <div class="topbar__right">
        <select class="unitsel" id="unitSel" title="금액 표시 단위">
          <option value="">자동</option>
          <option value="억">억원</option>
          <option value="백만">백만원</option>
          <option value="만">만원</option>
          <option value="원">원</option>
        </select>
        <div class="yearpick" id="yearPick" hidden>
          <button class="yearpick__btn" id="yearPrev" aria-label="이전 연도">‹</button>
          <span class="yearpick__val" id="yearVal">2026</span>
          <button class="yearpick__btn" id="yearNext" aria-label="다음 연도">›</button>
        </div>
        <button class="pill" id="reloadBtn" title="폴더에서 다시 읽기" hidden>
          <span class="pill__dot"></span><span>다시 읽기</span>
        </button>
        <div class="folderstat" id="folderStat">
          <span class="folderstat__icon">📁</span>
          <span class="folderstat__text" id="folderText">폴더 미선택</span>
        </div>
      </div>
    </header>

    <main class="content" id="content"></main>
    <div class="toasts" id="toasts" aria-live="polite"></div>
  </div>

  <!-- 일반 스크립트 → file:// 더블클릭으로도 로딩됨 (모듈 아님) -->
  <script src="./vendor/xlsx.full.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
